name: CI
on: push

jobs:
  fpm-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        toolchain:
          - { compiler: gfortran }
          - { compiler: ifx }
          - { compiler: ifort }
        exclude:
          - os: macos-latest
            toolchain: { compiler: ifx }
          - os: macos-latest
            toolchain: { compiler: ifort }
        include:
          - os: ubuntu-latest
            toolchain: { compiler: nvfortran }
          - os: windows-latest
            toolchain: { msystem: ucrt64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: minhqdao/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: fpm test

  make-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        toolchain:
          - { compiler: gfortran }
          - { compiler: ifx }
          - { compiler: ifort }
          - { compiler: lfortran }
          - { compiler: flang }
        exclude:
          - os: macos-latest
            toolchain: { compiler: ifx }
          - os: macos-latest
            toolchain: { compiler: ifort }
        include:
          - os: ubuntu-latest
            toolchain: { compiler: nvfortran }
          - os: ubuntu-latest
            toolchain: { compiler: aocc }
          - os: ubuntu-24.04-arm
            toolchain: { compiler: nvfortran }
          - os: macos-26-intel
            toolchain: { compiler: ifort }
          - os: windows-latest
            toolchain: { msystem: ucrt64 }
          - os: windows-11-arm
            toolchain: { compiler: flang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: minhqdao/setup-fortran@v1
        id: setup
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - run: echo "${{ steps.setup.outputs.version }}"
      - run: make test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check formatting
        run: |
          pip install fprettify

          diff=$(fprettify -i 2 -r . -d)

          if [[ $diff ]]; then
            red="\033[0;31m"
            cyan="\033[0;36m"
            reset="\033[0m"
            printf -- "$diff\n"
            printf "${red}The code is not correctly formatted. Please run: ${reset}\n"
            printf "${cyan}fprettify -i 2 -r .${reset}\n"
            exit 1
          fi
