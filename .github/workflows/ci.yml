name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fpm-test:
    name: fpm / ${{ matrix.os }} / ${{ matrix.toolchain.compiler }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - compiler: gfortran
            fpm_flags: "--flag '-Wall -Wextra -fcheck=all -fbacktrace'"
          - compiler: ifx
            fpm_flags: "--flag -warn:all"
          - compiler: ifort
            fpm_flags: "--flag -warn:all"
        exclude:
          - os: macos-latest
            toolchain: { compiler: ifx }
          - os: macos-latest
            toolchain: { compiler: ifort }
        include:
          - os: ubuntu-latest
            toolchain:
              compiler: nvfortran
              fpm_flags: "--flag '-Minform=inform'"
          - os: windows-latest
            toolchain:
              msystem: ucrt64
              fpm_flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: minhqdao/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: fpm test ${{ matrix.toolchain.fpm_flags }}

  make-test:
    name: Make / ${{ matrix.os }} / ${{ matrix.toolchain.compiler }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - compiler: gfortran
            make_flags: "FFLAGS='-O2 -Wall -Wextra -fcheck=all -fbacktrace'"
          - compiler: ifx
            make_flags: 'FFLAGS="-O2 -warn:all"'
          - compiler: ifort
            make_flags: 'FFLAGS="-O2 -warn:all"'
          - compiler: lfortran
            make_flags: ""
          - compiler: flang
            make_flags: ""
        exclude:
          - os: macos-latest
            toolchain: { compiler: ifx }
          - os: macos-latest
            toolchain: { compiler: ifort }
        include:
          - os: ubuntu-24.04-arm
            toolchain:
              compiler: gfortran
              make_flags: "FFLAGS='-O2 -Wall -Wextra -fcheck=all -fbacktrace'"
          - os: ubuntu-22.04
            toolchain:
              compiler: gfortran
              version: "11"
              make_flags: "FFLAGS='-O2 -Wall -Wextra -fcheck=all -fbacktrace'"
          - os: ubuntu-latest
            toolchain:
              compiler: nvfortran
              make_flags: 'FFLAGS="-O2 -Minform=inform"'
          - os: ubuntu-24.04-arm
            toolchain:
              compiler: nvfortran
              make_flags: 'FFLAGS="-O2 -Minform=inform"'
          - os: macos-26-intel
            toolchain:
              compiler: ifort
              make_flags: 'FFLAGS="-O2 -warn:all"'
          - os: windows-latest
            toolchain:
              msystem: ucrt64
              make_flags: ""
          - os: windows-11-arm
            toolchain:
              compiler: flang
              make_flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: minhqdao/setup-fortran@v1
        id: setup
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - run: echo "${{ steps.setup.outputs.version }}"
      - run: |
          if [[ "$RUNNER_OS" == "Windows" && \
                "$FORTRAN_COMPILER" =~ ^(flang|ifort|ifx)$ ]]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            link_exe=$("$vswhere" -latest -products '*' \
              -find 'VC\Tools\MSVC\**\bin\Host*\*\link.exe' | head -n 1 | tr -d '\r')
            if [[ -n "$link_exe" ]]; then
              export PATH="$(dirname "$(cygpath -u "$link_exe")"):$PATH"
            fi
          fi
          make test ${{ matrix.toolchain.make_flags }}
        shell: bash

  cmake-test:
    name: CMake / ${{ matrix.os }} / ${{ matrix.toolchain.compiler }} / ${{ matrix.linkage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            linkage: static
            toolchain: { compiler: gfortran }
          - os: ubuntu-latest
            linkage: shared
            toolchain: { compiler: gfortran }
          - os: macos-latest
            linkage: static
            toolchain: { compiler: gfortran }
          - os: windows-latest
            linkage: static
            toolchain: { compiler: gfortran }
          - os: windows-latest
            linkage: static
            toolchain: { compiler: ifx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: minhqdao/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.linkage == 'shared' }}
      - run: cmake --build build/cmake --config Release --parallel
      - run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Install
        run: cmake --install build/cmake --config Release --prefix "${{ runner.temp }}/version-f-install"
      - name: Configure installed-package consumer
        run: cmake -S cmake/test/find-package -B build/find-package -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/version-f-install"
      - run: cmake --build build/find-package --config Release --parallel
      - run: ctest --test-dir build/find-package -C Release --output-on-failure
      - name: Configure FetchContent consumer
        run: cmake -S cmake/test/fetch-content -B build/fetch-content -DCMAKE_BUILD_TYPE=Release -DVERSION_F_SOURCE_DIR="${{ github.workspace }}"
      - run: cmake --build build/fetch-content --config Release --parallel
      - run: ctest --test-dir build/fetch-content -C Release --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check formatting
        run: |
          pip install fprettify

          diff=$(fprettify -i 2 -r . -d)

          if [[ $diff ]]; then
            red="\033[0;31m"
            cyan="\033[0;36m"
            reset="\033[0m"
            printf -- "$diff\n"
            printf "${red}The code is not correctly formatted. Please run: ${reset}\n"
            printf "${cyan}fprettify -i 2 -r .${reset}\n"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check with Fortitude
        run: |
          pip install fortitude-lint
          fortitude check .

  standard-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: minhqdao/setup-fortran@v1
        with:
          compiler: gfortran
      - name: Check Fortran 2008 conformance
        run: |
          mkdir -p build/standard
          gfortran -std=f2008 -pedantic-errors -fsyntax-only \
            -J build/standard src/version_f.f90
          gfortran -std=f2008 -pedantic-errors -fsyntax-only \
            -I build/standard test/*.f90 example/*.f90 cmake/test/consumer.f90

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: minhqdao/setup-fortran@v1
        with:
          compiler: gfortran
          version: "15"
      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run tests with coverage
        run: |
          pip install gcovr
          fpm test --build-dir build/coverage-fpm --flag '--coverage -O0 -g' --link-flag '--coverage'
          mkdir -p build/coverage
          gcovr --root . --filter src/ --gcov-executable gcov-15 --fail-under-line 1 --txt --cobertura build/coverage/coverage.xml --html-details build/coverage/index.html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: build/coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage
