name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the form vMAJOR.MINOR.PATCH."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' fpm.toml)
          if [[ "$version" != "$manifest_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match fpm.toml version $manifest_version."
            exit 1
          fi

          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release commit $release_commit is not contained in main."
            exit 1
          fi

          ci_run=$(gh run list \
            --workflow ci.yml \
            --commit "$release_commit" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [[ -z "$ci_run" ]]; then
            echo "::error::The release commit does not have a successful CI run on main."
            exit 1
          fi

      - name: Create source archives
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          archive="version-f-$version"

          mkdir dist
          git archive --format=tar --prefix="$archive/" "$release_commit" |
            gzip -n > "dist/$archive.tar.gz"
          git archive --format=zip --prefix="$archive/" \
            --output="dist/$archive.zip" "$release_commit"

          pushd dist
          sha256sum "$archive.tar.gz" "$archive.zip" > SHA256SUMS
          popd

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/version-f-$version.tar.gz" \
            "dist/version-f-$version.zip" \
            "dist/SHA256SUMS" \
            --fail-on-no-commits \
            --generate-notes \
            --title "version-f $GITHUB_REF_NAME" \
            --verify-tag
